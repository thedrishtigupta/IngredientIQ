# Local Postgres for IngredientIQ. Start with: docker compose up -d --wait
# Matches the version the shared dump was made with (PostgreSQL 18).
services:
  db:
    image: postgres:18
    container_name: ingredientiq-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PGUSER:-postgres}
      POSTGRES_PASSWORD: ${PGPASSWORD:-ingredientiq}
      POSTGRES_DB: ${PGDATABASE:-ingredientiq}
    ports:
      - "${PGPORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-postgres} -d ${PGDATABASE:-ingredientiq}"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
